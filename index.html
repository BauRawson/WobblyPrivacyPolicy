<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Privacy policies for Wobbly Games.">
    <title>Wobbly Games — Privacy Policies</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f8fb; color: #20202a; }
      main { box-sizing: border-box; max-width: 680px; min-height: 100vh; margin: 0 auto; padding: 72px 24px; }
      h1 { margin: 0 0 8px; font-size: clamp(2rem, 7vw, 3rem); line-height: 1.15; }
      p { margin: 0 0 24px; }
      a { color: #5133bc; }
      .games { padding: 0; list-style: none; }
      .games a { display: block; padding: 16px 18px; border-radius: 12px; background: #fff; box-shadow: 0 1px 4px #20202a14; font-weight: 700; text-decoration: none; }
      .games a:hover, .games a:focus-visible { text-decoration: underline; }
      @media (prefers-color-scheme: dark) { body { background: #17171d; color: #f3f3f7; } .games a { background: #252530; color: #c6b5ff; } a { color: #c6b5ff; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Wobbly Games</h1>
      <p>Privacy policies for our games.</p>
      <ul class="games">
        <li><a href="poppop/">POP POP! privacy policy</a></li>
        <li><a href="sleepyknight/">SleepyKnight privacy policy</a></li>
      </ul>
    </main>
  </body>
</html>
